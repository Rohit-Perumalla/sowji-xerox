name: Sowji Xerox - Android APK Build & Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type (debug, release, or both)'
        required: true
        default: 'both'
        type: choice
        options:
          - both
          - debug
          - release

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, Verify & Package Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read

    steps:
      # Step 1: Check out repository
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Step 2: Set up Node.js
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # Step 3: Install Node Dependencies
      - name: Install Node Dependencies
        run: |
          echo "=== Installing Node Dependencies ==="
          npm ci --prefer-offline || npm install

      # Step 4: Verify Project (TypeScript Lint & Web Asset Compilation)
      - name: Verify Web Project & Run Lints
        run: |
          echo "=== Verifying Project & Running TypeScript Compiler Check ==="
          npm run lint
          echo "=== Building Production Web Assets ==="
          npm run build
          
          # Sync web assets into Android app assets folder
          echo "Syncing production web assets into Android assets directory..."
          mkdir -p app/src/main/assets/web
          cp -r dist/* app/src/main/assets/web/
          ls -la app/src/main/assets/web/

      # Step 5: Set up JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      # Step 6: Set up Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # Step 7: Grant Execute Permissions to Gradlew
      - name: Grant Execute Permissions to Gradlew
        run: |
          chmod +x gradlew
          ls -lh gradlew

      # Step 8: Run Unit Tests
      - name: Run Android Unit & Driver Tests
        run: |
          echo "=== Running Android Unit Tests ==="
          ./gradlew test --stacktrace

      # Step 9: Build Android Debug APK
      - name: Assemble Debug APK
        if: ${{ github.event.inputs.build_type != 'release' }}
        run: |
          echo "=== Building Android Debug APK ==="
          ./gradlew assembleDebug --stacktrace
          
          # Verify debug APK output exists before proceeding
          if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "SUCCESS: Debug APK built successfully!"
            cp app/build/outputs/apk/debug/app-debug.apk Sowji-Xerox-Debug.apk
            ls -lh Sowji-Xerox-Debug.apk
          else
            echo "::error::Debug APK was not found at expected path: app/build/outputs/apk/debug/app-debug.apk"
            exit 1
          fi

      # Step 10: Build Signed Release APK when secrets are available
      - name: Assemble Signed Release APK
        id: assemble_release
        if: ${{ github.event.inputs.build_type != 'debug' }}
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY_BASE64 || secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PWD: ${{ secrets.KEY_STORE_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_AL: ${{ secrets.KEY_ALIAS || secrets.ANDROID_KEY_ALIAS }}
          KEY_PWD: ${{ secrets.KEY_PASSWORD || secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "=== Evaluating Release Signing Credentials ==="
          if [ -n "$SIGNING_KEY" ] && [ -n "$KEYSTORE_PWD" ] && [ -n "$KEY_AL" ] && [ -n "$KEY_PWD" ]; then
            echo "Release signing secrets detected. Decoding keystore into secure workspace..."
            echo "$SIGNING_KEY" | base64 --decode > app/release.keystore
            
            export KEYSTORE_PATH="release.keystore"
            export KEYSTORE_PASSWORD="$KEYSTORE_PWD"
            export KEY_ALIAS="$KEY_AL"
            export KEY_PASSWORD="$KEY_PWD"
            
            echo "Building signed Release APK with Proguard/R8 optimization..."
            ./gradlew assembleRelease --stacktrace
            
            # Securely shred/remove the temporary keystore
            rm -f app/release.keystore
            
            # Verify signed release APK output exists before continuing
            if [ -f "app/build/outputs/apk/release/app-release.apk" ]; then
              echo "SUCCESS: Signed Release APK successfully generated!"
              cp app/build/outputs/apk/release/app-release.apk Sowji-Xerox-Release.apk
              cp app/build/outputs/apk/release/app-release.apk Sowji-Xerox.apk
              ls -lh Sowji-Xerox-Release.apk
              echo "signed_release=true" >> "$GITHUB_OUTPUT"
            else
              echo "::error::Signed Release APK was not found at: app/build/outputs/apk/release/app-release.apk"
              exit 1
            fi
          else
            echo "::warning::Release signing secrets (SIGNING_KEY_BASE64 / ANDROID_KEYSTORE_BASE64) are not configured."
            echo "Building release APK using debug signature fallback..."
            
            ./gradlew assembleRelease --stacktrace
            
            if [ -f "app/build/outputs/apk/release/app-release.apk" ]; then
              echo "Release APK generated using fallback signature."
              cp app/build/outputs/apk/release/app-release.apk Sowji-Xerox-Release.apk
              cp app/build/outputs/apk/release/app-release.apk Sowji-Xerox.apk
              echo "signed_release=false" >> "$GITHUB_OUTPUT"
            elif [ -f "app/build/outputs/apk/release/app-release-unsigned.apk" ]; then
              cp app/build/outputs/apk/release/app-release-unsigned.apk Sowji-Xerox-Unsigned.apk
              echo "signed_release=false" >> "$GITHUB_OUTPUT"
            elif [ -f "Sowji-Xerox-Debug.apk" ]; then
              echo "Using Debug APK as preview package."
              cp Sowji-Xerox-Debug.apk Sowji-Xerox.apk
              echo "signed_release=false" >> "$GITHUB_OUTPUT"
            else
              echo "::error::No APK found to publish."
              exit 1
            fi
          fi

      # Step 11: Verify APK Existence & Compute SHA-256 Checksums
      - name: Verify APKs & Compute Checksums
        run: |
          echo "=== Verifying Generated APK Files ==="
          ls -lh Sowji-Xerox*.apk
          
          # Ensure at least one genuine APK exists
          APK_COUNT=$(ls -1 Sowji-Xerox*.apk 2>/dev/null | wc -l)
          if [ "$APK_COUNT" -eq 0 ]; then
            echo "::error::No genuine APK files were found. Aborting workflow."
            exit 1
          fi
          
          echo "=== Generating SHA-256 Checksums ==="
          sha256sum Sowji-Xerox*.apk | tee checksums.txt
          cat checksums.txt

      # Step 12: Upload APK Artifacts
      - name: Upload Debug APK Artifact
        if: ${{ hashFiles('Sowji-Xerox-Debug.apk') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: Sowji-Xerox-Debug-APK
          path: Sowji-Xerox-Debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Release APK Artifact
        if: ${{ hashFiles('Sowji-Xerox-Release.apk') != '' || hashFiles('Sowji-Xerox.apk') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: Sowji-Xerox-Release-APK
          path: Sowji-Xerox*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Checksums Artifact
        uses: actions/upload-artifact@v4
        with:
          name: APK-SHA256-Checksums
          path: checksums.txt
          retention-days: 30

      # Step 13: Publish APK Files to GitHub Releases
      - name: Publish APKs to GitHub Release
        if: ${{ (github.event_name == 'release' && github.event.action == 'published') || startsWith(github.ref, 'refs/tags/v') }}
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Sowji-Xerox*.apk
            checksums.txt
          fail_on_unmatched_files: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
